name: KittyClan
options:
  bundleIdPrefix: com.madebyraygun
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: GR76S8DM44
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KittyClan:
    type: application
    platform: iOS
    sources:
      - path: KittyClan
        excludes: ["Resources/**"]
      - path: KittyClan/Resources/Sprites
        type: folder
        buildPhase: resources
      - path: KittyClan/Resources/Text
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madebyraygun.kittyclan
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: KittyClan
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMPRESS_PNG_FILES: NO
        STRIP_PNG_TEXT: NO
  KittyClanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KittyClanTests
        excludes: ["Golden/**"]
      - path: KittyClanTests/Golden
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KittyClan
